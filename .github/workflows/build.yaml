name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      nanoprc_ref:
        description: nanoPRC branch, tag or commit to build against
        default: main

env:
  NANOPRC_REPO: CascadiaVoxel/nanoPRC
  NANOPRC_REF: ${{ github.event.inputs.nanoprc_ref || 'main' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout prc_ply_rw
        uses: actions/checkout@v5
        with:
          path: prc_ply_rw

      # nanoPRC is checked out beside this repository, never inside it. Only
      # its zlib submodule is needed: SDL, imgui and MatrixUtil serve its demos.
      - name: Checkout nanoPRC
        uses: actions/checkout@v5
        with:
          repository: ${{ env.NANOPRC_REPO }}
          ref: ${{ env.NANOPRC_REF }}
          path: nanoPRC

      - name: Fetch nanoPRC's zlib submodule
        run: git -C nanoPRC submodule update --init --depth 1 thirdparty/zlib

      - name: Configure
        run: cmake -S prc_ply_rw -B build -DNANOPRC_SOURCE_DIR="$GITHUB_WORKSPACE/nanoPRC" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      # The goldens are byte-exact, so this also checks that every platform
      # writes the same bytes.
      - name: mesh2ply tests
        run: |
          if [ -d build/bin/Release ]; then bin=build/bin/Release; else bin=build/bin; fi
          if [ "$RUNNER_OS" = Windows ]; then py=python; exe=mesh2ply.exe; else py=python3; exe=mesh2ply; fi
          $py prc_ply_rw/tests/mesh2ply/run_tests.py "$bin/$exe" --fuzz 500

      # Every expected value is written out in the script, so this also
      # checks that every platform writes the same colours.
      - name: ply_colourise tests
        run: |
          if [ -d build/bin/Release ]; then bin=build/bin/Release; else bin=build/bin; fi
          if [ "$RUNNER_OS" = Windows ]; then exe=ply_colourise.exe; else exe=ply_colourise; fi
          bash prc_ply_rw/tests/ply_colourise/run_tests.sh "$bin/$exe" ply_colourise_test

      - name: Round-trip the test files through PRC, PDF and all three PLY encodings
        run: |
          if [ -d build/bin/Release ]; then bin=build/bin/Release; else bin=build/bin; fi
          if [ "$RUNNER_OS" = Windows ]; then py=python; else py=python3; fi
          bash prc_ply_rw/tests/roundtrip.sh "$bin" roundtrip "$py"

  c99:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prc_ply_rw
        uses: actions/checkout@v5
        with:
          path: prc_ply_rw

      - name: Checkout nanoPRC
        uses: actions/checkout@v5
        with:
          repository: ${{ env.NANOPRC_REPO }}
          ref: ${{ env.NANOPRC_REF }}
          path: nanoPRC

      - name: Strict C99 check
        run: python3 prc_ply_rw/tests/check_c99.py --nanoprc nanoPRC -v
